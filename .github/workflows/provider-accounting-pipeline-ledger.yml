name: Provider accounting and pipeline ledger

on:
  pull_request:
    paths:
      - "tools/api_credit_tracker.py"
      - "tools/provider_usage.py"
      - "tools/pipeline_ledger.py"
      - "tools/pipeline_health.py"
      - "tools/control_plane_status.py"
      - "tools/watcher_cycle_ledger.py"
      - "tools/watcher_cycle_contract.py"
      - "tools/watcher_persistence_gate.py"
      - "tools/watcher_evidence_retention.py"
      - "tools/run_signal_watcher_with_ledger.sh"
      - "tools/telegram_delivery.py"
      - "tools/telegram_send_guard.py"
      - "tools/telegram_send.sh"
      - "tools/telegram_ops_ux.py"
      - "tools/heartbeat_runtime.py"
      - "tools/supabase_publish.py"
      - "tools/chart_generator.py"
      - "tools/chart_generator_core.py"
      - "tools/market_pulse_v2.py"
      - "tools/signal_watcher_pro.sh"
      - "tools/signal_watcher_core.sh"
      - "tools/data_fetch_candles.sh"
      - "tools/indicators_updater.sh"
      - "tools/run_shadow_manager.sh"
      - "tools/bota_supervisor.sh"
      - "tools/heartbeat.sh"
      - "ops/systemd/bota.service"
      - "tests/**"
      - ".github/workflows/provider-accounting-pipeline-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: |
          python -m py_compile \
            tools/api_credit_tracker.py \
            tools/provider_usage.py \
            tools/pipeline_ledger.py \
            tools/pipeline_health.py \
            tools/control_plane_status.py \
            tools/watcher_cycle_ledger.py \
            tools/watcher_cycle_contract.py \
            tools/watcher_persistence_gate.py \
            tools/watcher_evidence_retention.py \
            tools/telegram_delivery.py \
            tools/telegram_send_guard.py \
            tools/telegram_ops_ux.py \
            tools/heartbeat_runtime.py \
            tools/supabase_publish.py \
            tools/chart_generator.py \
            tools/chart_generator_core.py \
            tools/market_pulse_v2.py
      - name: Check shell syntax
        run: |
          bash -n tools/data_fetch_candles.sh
          bash -n tools/indicators_updater.sh
          bash -n tools/run_signal_watcher_with_ledger.sh
          bash -n tools/telegram_send.sh
          bash -n tools/signal_watcher_pro.sh
          bash -n tools/signal_watcher_core.sh
          bash -n tools/run_shadow_manager.sh
          bash -n tools/bota_supervisor.sh
          bash -n tools/heartbeat.sh
      - name: Run focused regression tests
        run: |
          python -m unittest -v \
            tests.test_provider_accounting_pipeline_ledger \
            tests.test_watcher_cycle_observability \
            tests.test_supabase_cycle_evidence \
            tests.test_predeploy_crash_consistency \
            tests.test_predeploy_crash_consistency_v2 \
            tests.test_telegram_evidence_fail_closed \
            tests.test_telegram_commit_ordering \
            tests.test_runtime_deployment_barrier \
            tests.test_watcher_cycle_contract \
            tests.test_watcher_evidence_retention \
            tests.test_market_pulse_v2 \
            tests.test_heartbeat_runtime_policy \
            tests.test_bota_supervisor_service_policy \
            tests.test_telegram_ops_ux \
            tests.test_r5_calendar_env_contract \
            tests.test_r5_measurement_hardening
